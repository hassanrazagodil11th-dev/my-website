<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Dashboard | Content Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        aside h2 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        aside nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        aside nav a:hover, aside nav a.active {
            background-color: #e0e7ff;
            color: var(--primary);
        }

        /* Main Content Area */
        main {
            flex: 1;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 30px;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #334155;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: #fdfdfd;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button.submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button.submit-btn:hover {
            background: var(--primary-hover);
        }

        .success-banner {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        /* Manage Existing Items List */
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .manage-item:last-child {
            border-bottom: none;
        }

        .manage-info span {
            font-weight: 600;
            display: block;
        }

        .manage-info small {
            color: var(--text-muted);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: var(--danger-hover);
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <h2>⚡ Admin Panel</h2>
        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="/" target="_blank">View Live Website ↗</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main>
        <header>
            <h1>Broadcast Content Manager</h1>
            <p>Publish announcements, updates, or media files straight to your website feed.</p>
        </header>

        <!-- Success Message Banner -->
        <div id="successBanner" class="success-banner">Successfully published new update!</div>

        <!-- Create Post Card -->
        <div class="card">
            <h3>Publish New Update</h3>
            <form action="/api/upload-content" method="POST" enctype="multipart/form-data">
                <label for="title">Title / Heading</label>
                <input type="text" id="title" name="title" placeholder="e.g., Major Website Update Live!" required>

                <label for="description">Description / Details</label>
                <textarea id="description" name="description" placeholder="Provide details about your broadcast or upload..."></textarea>

                <label for="mediaFile">Upload Media (Optional Image, Audio MP3, or Document)</label>
                <input type="file" id="mediaFile" name="mediaFile">

                <button type="submit" class="submit-btn">Publish to Website</button>
            </form>
        </div>

        <!-- Manage / Delete Content Card -->
        <div class="card">
            <h3>Manage Existing Broadcasts</h3>
            <div id="manage-container" class="empty-state">Loading active broadcasts...</div>
        </div>
    </main>

    <script>
        // Check for success URL query parameter to show banner
        if (window.location.search.includes('success=true')) {
            const banner = document.getElementById('successBanner');
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
        }

        // Fetch and render list of content items for deletion management
        function loadManageList() {
            fetch('/api/content')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('manage-container');
                    if (!data || data.length === 0) { 
                        container.className = 'empty-state';
                        container.innerHTML = 'No active updates found.'; 
                        return; 
                    }
                    
                    container.className = '';
                    container.innerHTML = '';
                    data.forEach(item => {
                        container.innerHTML += `
                            <div class="manage-item">
                                <div class="manage-info">
                                    <span>${item.title || 'Untitled Post'}</span>
                                    <small>${item.filetype ? 'Contains file attachment' : 'Text-only update'}</small>
                                </div>
                                <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
                            </div>`;
                    });
                })
                .catch(err => {
                    document.getElementById('manage-container').innerHTML = '<p style="color: red;">Failed to load posts from server.</p>';
                });
        }

        // Handle item deletion
        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this update?')) {
                fetch(`/api/delete/${id}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(response => {
                        if (response.success) {
                            loadManageList();
                        } else {
                            alert('Failed to delete item.');
                        }
                    })
                    .catch(() => alert('Network error while deleting.'));
            }
        }

        // Load list on page open
        loadManageList();
    </script>
</body>
</html>
