<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhleSunnat.AI - Islamic Knowledge Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            border: 1px solid #334155;
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            border: 3px solid #fbbf24;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fbbf24;
        }
        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .btn-admin {
            background-color: #334155;
            color: #f8fafc;
        }
        .btn-admin:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">☪</div>
        <h1>AhleSunnat.AI</h1>
        <p>Welcome to the Islamic Knowledge Portal based on authentic research strictly from Seerat-e-Muhammadiya, Bahar-e-Shariat, Kitabul Aqaa'id, Aqaa'id with Tafseer e Naeemi, and Fatawa Rizwiya.</p>
        
        <div class="btn-group">
            <a href="#" class="btn">Explore Knowledge Base</a>
            <a href="admin-dashboard.html" class="btn btn-admin">Admin Panel</a>
        </div>
    </div>

</body>
</html>
